name: PulseOrbit SEO health check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 09:00 Bangladesh time

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checker dependency
        run: pip install requests
      - name: Validate Python and generated site files
        run: |
          python -m compileall -q scripts
          python scripts/build_site.py
      - name: Check published sitemap URLs
        run: python scripts/seo_check.py
