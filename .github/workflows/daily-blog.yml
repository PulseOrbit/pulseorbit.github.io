name: PulseOrbit daily publishing

on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *' # 07:30 Bangladesh time (UTC+6)

permissions:
  contents: write

concurrency:
  group: pulseorbit-daily-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Validate Python syntax
        run: python -m compileall -q scripts
      - name: Generate two researched stories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/generate.py
      - name: Commit published stories
        run: |
          if git diff --quiet -- posts/index.json; then
            echo "No new stories were generated."
            exit 0
          fi
          git config user.name "PulseOrbit Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add posts/index.json
          git commit -m "Publish two daily PulseOrbit stories"
          git push
