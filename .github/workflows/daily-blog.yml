name: PulseOrbit daily publishing
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
permissions:
  contents: write
concurrency:
  group: pulseorbit-daily-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Validate dependency manifest
        run: python -c 'from pathlib import Path; lines=Path("requirements.txt").read_text().splitlines(); assert len([x for x in lines if x.strip()]) >= 2; assert all("\\\\n" not in x for x in lines); print("Dependency manifest valid")'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Validate Python and JavaScript
        run: python -m compileall -q scripts && node --check assets/js/app.js
      - name: Generate articles and upload licensed images to Hugging Face
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          HF_DATASET_REPO: AhyanCreationsLTD/pulseorbit-images
        run: python scripts/generate.py
      - name: Build article pages and sitemap
        run: python scripts/build_site.py
      - name: Validate generated output
        run: |
          python -m json.tool posts/index.json > /dev/null
          python -c "import xml.etree.ElementTree as E; E.parse('sitemap.xml'); print('Sitemap XML valid')"
      - name: Commit and push generated content
        run: |
          if git diff --quiet; then echo "No generated changes"; exit 0; fi
          git config user.name "PulseOrbit Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish fresh PulseOrbit stories"
          git push
