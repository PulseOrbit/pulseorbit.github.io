name: PulseOrbit daily publishing
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
permissions:
  contents: write
concurrency:
  group: pulseorbit-daily-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - run: python -m compileall -q scripts
      - name: Generate two original stories and find reusable images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python scripts/generate.py
      - name: Build article pages and sitemap
        run: python scripts/build_site.py
      - name: Publish generated content
        run: |
          if git diff --quiet; then echo "No new content"; exit 0; fi
          git config user.name "PulseOrbit Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish fresh PulseOrbit stories"
          git push
