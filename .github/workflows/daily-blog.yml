name: PulseOrbit daily publishing
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
permissions:
  contents: write
concurrency:
  group: pulseorbit-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generate two researched stories
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate.py
      - name: Commit published stories
        run: |
          if git diff --quiet; then
            echo "No new stories to publish."
            exit 0
          fi
          git config user.name "PulseOrbit Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add posts/index.json
          git commit -m "Publish daily PulseOrbit stories"
          git push