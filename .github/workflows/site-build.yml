name: PulseOrbit static page builder

on:
  workflow_dispatch:
  push:
    paths:
      - 'posts/index.json'
      - 'scripts/build_site.py'
      - '.github/workflows/site-build.yml'

permissions:
  contents: write

concurrency:
  group: pulseorbit-static-builder
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build crawlable article pages and sitemap
        run: python scripts/build_site.py
      - name: Commit generated pages when changed
        run: |
          if git diff --quiet; then
            echo "Static pages are already up to date."
            exit 0
          fi
          git config user.name "PulseOrbit Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build static article pages and sitemap"
          git push
