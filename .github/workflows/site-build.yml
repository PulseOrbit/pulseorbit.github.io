name: PulseOrbit static site builder
on:
  workflow_dispatch:
  push:
    paths:
      - 'posts/index.json'
      - 'scripts/build_site.py'
      - 'scripts/generate.py'
      - 'assets/js/**'
      - 'assets/css/**'
      - 'index.html'
      - '.github/workflows/site-build.yml'
permissions:
  contents: write
concurrency:
  group: pulseorbit-site-builder
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source files
        run: |
          python -m compileall -q scripts
          node --check assets/js/app.js
          python -m json.tool posts/index.json > /dev/null
      - name: Build article pages and sitemap
        run: python scripts/build_site.py
      - name: Validate sitemap
        run: python -c "import xml.etree.ElementTree as E; E.parse('sitemap.xml'); print('Sitemap XML valid')"
      - name: Commit generated pages
        run: |
          if git diff --quiet; then echo "Site already up to date"; exit 0; fi
          git config user.name "PulseOrbit Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild PulseOrbit article pages"
          git push
