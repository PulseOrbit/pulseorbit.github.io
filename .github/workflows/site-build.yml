name: PulseOrbit static site builder
on:
  workflow_dispatch:
  push:
    paths:
      - 'posts/index.json'
      - 'scripts/build_site.py'
      - '.github/workflows/site-build.yml'
permissions:
  contents: write
concurrency:
  group: pulseorbit-site-builder
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate site scripts
        run: python -m compileall -q scripts && node --check assets/js/app.js
      - name: Generate static article pages
        run: python scripts/build_site.py
      - name: Commit generated pages if needed
        run: |
          if git diff --quiet; then echo "Site already up to date"; exit 0; fi
          git config user.name "PulseOrbit Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Build article pages and sitemap"
          git push
